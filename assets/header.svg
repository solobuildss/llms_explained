<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="llms-explained — How Large Language Models Actually Work">
  <title>llms-explained · a deep technical guide to LLMs</title>

  <defs>
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#1F2A22" opacity="0.5"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4ADE80" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- canvas · terminal black -->
  <rect width="1280" height="360" fill="#060807"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)" opacity="0.5"/>

  <!-- terminal window -->
  <g transform="translate(40, 30)">
    <!-- window background -->
    <rect width="1200" height="300" fill="#0D1110" stroke="#1F2A22" stroke-width="1"/>

    <!-- title bar -->
    <rect width="1200" height="32" fill="#060807"/>
    <line x1="0" y1="32" x2="1200" y2="32" stroke="#1F2A22" stroke-width="1"/>

    <!-- traffic lights -->
    <circle cx="20" cy="16" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="16" r="6" fill="#FEBC2E"/>
    <circle cx="64" cy="16" r="6" fill="#28C840"/>

    <!-- filename -->
    <text x="600" y="21" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace" font-size="12" fill="#6B7368">~/the-mechanics-of-machine-minds.md</text>

    <!-- content area -->
    <g font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace" transform="translate(32, 60)">

      <!-- $ prompt -->
      <text y="20" font-size="13">
        <tspan fill="#4ADE80" font-weight="700">$</tspan>
        <tspan fill="#A8B8A8" dx="6">cat the-mechanics-of-machine-minds.md</tspan>
      </text>

      <!-- ## section marker -->
      <text y="52" font-size="11" fill="#FBBF24" font-weight="700" letter-spacing="0.5">## 00_intro</text>

      <!-- main title · two lines, big -->
      <text y="106" font-size="40" font-weight="800" fill="#D4E4D4" letter-spacing="-1.6">how large language</text>
      <text y="152" font-size="40" font-weight="800" fill="#D4E4D4" letter-spacing="-1.6">models actually <tspan fill="#4ADE80">[work]</tspan></text>

      <!-- blinking cursor at end of title -->
      <rect x="618" y="122" width="11" height="33" fill="#4ADE80">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <!-- subtitle comment -->
      <text y="186" font-size="13" fill="#6B7368">// a deep technical guide  ·  2026  ·  interactive  ·  dual-themed</text>

      <!-- topic chips -->
      <g font-size="11" font-weight="600">
        <g transform="translate(0, 210)">
          <rect width="80" height="22" fill="none" stroke="#22D3EE" stroke-width="1"/>
          <text x="40" y="15" text-anchor="middle" fill="#22D3EE">tokenizer</text>
        </g>
        <g transform="translate(86, 210)">
          <rect width="100" height="22" fill="none" stroke="#22D3EE" stroke-width="1"/>
          <text x="50" y="15" text-anchor="middle" fill="#22D3EE">transformer</text>
        </g>
        <g transform="translate(192, 210)">
          <rect width="80" height="22" fill="none" stroke="#22D3EE" stroke-width="1"/>
          <text x="40" y="15" text-anchor="middle" fill="#22D3EE">attention</text>
        </g>
        <g transform="translate(278, 210)">
          <rect width="84" height="22" fill="none" stroke="#22D3EE" stroke-width="1"/>
          <text x="42" y="15" text-anchor="middle" fill="#22D3EE">inference</text>
        </g>
        <g transform="translate(368, 210)">
          <rect width="80" height="22" fill="none" stroke="#22D3EE" stroke-width="1"/>
          <text x="40" y="15" text-anchor="middle" fill="#22D3EE">hardware</text>
        </g>
        <g transform="translate(454, 210)">
          <rect width="92" height="22" fill="none" stroke="#22D3EE" stroke-width="1"/>
          <text x="46" y="15" text-anchor="middle" fill="#22D3EE">economics</text>
        </g>
      </g>
    </g>

    <!-- RIGHT SIDE · mini layer stack visualization -->
    <g transform="translate(910, 70)" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace">
      <!-- output label and arrow -->
      <text x="120" y="0" text-anchor="middle" font-size="11" fill="#4ADE80" font-weight="700">→ work</text>
      <line x1="120" y1="6" x2="120" y2="22" stroke="#4ADE80" stroke-width="1.5"/>
      <polygon points="116,8 124,8 120,2" fill="#4ADE80"/>

      <!-- layer N -->
      <rect x="40" y="24" width="160" height="24" fill="none" stroke="#A8B8A8" stroke-width="1"/>
      <text x="120" y="40" text-anchor="middle" font-size="10" fill="#A8B8A8">layer N</text>

      <!-- layer N-1 -->
      <rect x="40" y="52" width="160" height="24" fill="none" stroke="#A8B8A8" stroke-width="1"/>
      <text x="120" y="68" text-anchor="middle" font-size="10" fill="#A8B8A8">layer N-1</text>

      <!-- ellipsis -->
      <text x="120" y="92" text-anchor="middle" font-size="14" fill="#6B7368" letter-spacing="4">···</text>

      <!-- attention + FFN highlighted green -->
      <rect x="40" y="100" width="160" height="24" fill="#4ADE80"/>
      <text x="120" y="116" text-anchor="middle" font-size="10" fill="#060807" font-weight="700">attention + ffn</text>

      <!-- embeddings highlighted cyan -->
      <rect x="40" y="128" width="160" height="24" fill="#22D3EE"/>
      <text x="120" y="144" text-anchor="middle" font-size="10" fill="#060807" font-weight="700">embeddings</text>

      <!-- arrow from tokens up -->
      <line x1="120" y1="170" x2="120" y2="156" stroke="#A8B8A8" stroke-width="1.5"/>
      <polygon points="116,160 124,160 120,154" fill="#A8B8A8"/>

      <!-- input tokens -->
      <g transform="translate(54, 174)">
        <rect x="0" y="0" width="32" height="20" fill="none" stroke="#A8B8A8" stroke-width="1"/>
        <text x="16" y="14" text-anchor="middle" font-size="9" fill="#A8B8A8">how</text>

        <rect x="36" y="0" width="32" height="20" fill="none" stroke="#A8B8A8" stroke-width="1"/>
        <text x="52" y="14" text-anchor="middle" font-size="9" fill="#A8B8A8">do</text>

        <rect x="72" y="0" width="32" height="20" fill="none" stroke="#A8B8A8" stroke-width="1"/>
        <text x="88" y="14" text-anchor="middle" font-size="9" fill="#A8B8A8">ai</text>

        <rect x="108" y="0" width="32" height="20" fill="#FBBF24"/>
        <text x="124" y="14" text-anchor="middle" font-size="9" fill="#060807" font-weight="700">?</text>
      </g>

      <!-- label below -->
      <text x="120" y="218" text-anchor="middle" font-size="9" fill="#6B7368" letter-spacing="0.5">decoder-only transformer</text>
    </g>
  </g>

  <!-- status bar at bottom -->
  <g transform="translate(0, 340)" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace" font-size="10">
    <rect width="1280" height="20" fill="#060807"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#1F2A22" stroke-width="1"/>

    <!-- left side: online indicator + path + scroll -->
    <text x="40" y="14">
      <tspan fill="#4ADE80">●</tspan>
      <tspan fill="#A8B8A8" dx="4">online</tspan>
    </text>
    <text x="120" y="14" fill="#FBBF24">~/intro</text>
    <text x="200" y="14" fill="#22D3EE">0%</text>

    <!-- right side: meta info -->
    <text x="1240" y="14" text-anchor="end" fill="#6B7368">v3.2 · monospace · utf-8</text>
  </g>
</svg>
